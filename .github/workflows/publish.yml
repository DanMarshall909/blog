name: Publish to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether PDFs need regenerating
        id: pdf_changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "$BEFORE_SHA^{commit}"; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- \
            'src/content/articles/resume/**' \
            'src/content/articles/resume-brief/**' \
            'src/components/**' \
            'src/layouts/**' \
            'src/pages/articles/**' \
            'src/styles/**' \
            'public/**' \
            'scripts/generate-pdfs.mjs' \
            'astro.config.*' \
            'package.json' \
            'package-lock.json'; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out previously published files
        if: steps.pdf_changes.outputs.required == 'false'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync article assets
        run: npm run sync-article-assets

      - name: Build site without automatically generating PDFs
        run: npm --ignore-scripts run build

      - name: Restore existing PDFs
        if: steps.pdf_changes.outputs.required == 'false'
        shell: bash
        run: |
          for slug in resume resume-brief; do
            pdf="previous-pages/docs/articles/$slug/article.pdf"
            if [ -f "$pdf" ]; then
              mkdir -p "docs/articles/$slug"
              cp "$pdf" "docs/articles/$slug/article.pdf"
            fi
          done

      - name: Install Chromium for PDF generation
        if: steps.pdf_changes.outputs.required == 'true'
        run: npx playwright install --with-deps chromium

      - name: Generate article PDFs
        if: steps.pdf_changes.outputs.required == 'true'
        run: npm run pdfs

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ./docs
